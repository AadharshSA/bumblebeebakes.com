<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BumbleBee Bakes: a home bakery in Coimbatore. Cookies, brownies, desserts and custom cakes, made in small batches. Order on WhatsApp." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FFF8EC" />
    <meta property="og:title" content="BumbleBee Bakes · Home bakery in Coimbatore" />
    <meta property="og:description" content="Cookies, brownies, desserts & custom cakes, made in small batches. Order on WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bumblebeebakes.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <body class="bg-vanilla text-ink font-sans antialiased">
    <!-- Netlify Forms: hidden copies so Netlify registers the fields at deploy time. Keep in sync with the React forms. -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field"><input name="ref"><input name="name"><input name="phone"><input name="lookingFor">
      <input name="date"><textarea name="message"></textarea><input type="file" name="referenceImage">
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
